name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # amd64 only: the one box that runs this is amd64, and compiling MakeMKV
      # under arm64 emulation would multiply the build time for no user.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: arm-makemkv:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The failure this image exists to prevent: an expired MakeMKV prints
      # "This application version is too old" and exits. Without a disc it does
      # not print that, so the version match is the real guard (it fails on the
      # upstream 1.18.4 image); the "too old" grep is a backstop.
      - name: MakeMKV runs and is the pinned version
        run: |
          want=$(sed -n 's/^ARG MAKEMKV_VERSION=//p' Dockerfile | head -1)
          out=$(docker run --rm --entrypoint makemkvcon arm-makemkv:ci -r info disc:9999 2>&1 || true)
          echo "$out" | head -5
          echo "$out" | grep -q "MakeMKV v${want} "
          ! echo "$out" | grep -qi "too old"

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/jasonsooter/arm-makemkv
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-
      - name: Publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
